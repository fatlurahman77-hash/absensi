<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Absensi TK PGRI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- MESIN PEMBACA QR CODE ASLI (TIDAK ADA LAGI SIMULASI) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes floatBubble {
      0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
    }
    @keyframes scanLaser {
      0% { top: 0%; box-shadow: 0 0 10px 2px rgba(34, 197, 94, 0.5); }
      50% { top: 100%; box-shadow: 0 0 10px 2px rgba(34, 197, 94, 1); }
      100% { top: 0%; box-shadow: 0 0 10px 2px rgba(34, 197, 94, 0.5); }
    }
    
    /* Background Screensaver Cerah Terkunci di Belakang */
    .bg-screensaver {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      z-index: -10;
    }

    /* Taburan Gelembung Lebat */
    .bubble {
      position: absolute;
      bottom: -50px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.8);
      animation: floatBubble infinite linear;
      z-index: -5;
    }

    /* Efek Glass Mutlak untuk Dark Mode yang Tembus Pandang ke Belakang */
    .glass-dark {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .glass-card-dark {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .laser-scanner {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: #22c55e;
      animation: scanLaser 2s linear infinite;
      z-index: 20;
    }

    /* Hilangkan scrollbar agar mulus */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="text-white antialiased overflow-x-hidden selection:bg-indigo-500 selection:text-white">
  
  <div id="root"></div>

  <script type="text/babel">
    // URL GOOGLE APPS SCRIPT ANDA
    const API_URL = "https://script.google.com/macros/s/AKfycbzM6T0CjiOjUDU_TptCvTfgT9EUh8dypTKrR0nDXwbSR6yXi7V5kHrb8amuaDgGC33drw/exec";

    // Komponen Gelembung Lebat
    const Bubbles = () => {
      const bubbles = Array.from({ length: 60 });
      return (
        <div className="fixed inset-0 overflow-hidden pointer-events-none z-[-5]">
          {bubbles.map((_, i) => (
            <div 
              key={i} 
              className="bubble" 
              style={{
                left: `${Math.random() * 100}%`,
                width: `${Math.random() * 40 + 10}px`,
                height: `${Math.random() * 40 + 10}px`,
                animationDuration: `${Math.random() * 8 + 4}s`,
                animationDelay: `${Math.random() * 5}s`
              }} 
            />
          ))}
        </div>
      );
    };

    const App = () => {
      const [activeTab, setActiveTab] = React.useState('dashboard');
      const [students, setStudents] = React.useState([]);
      const [teachers, setTeachers] = React.useState([]);
      const [searchQuery, setSearchQuery] = React.useState('');
      const [isFetching, setIsFetching] = React.useState(false);
      const [toastMsg, setToastMsg] = React.useState("");
      const [showToast, setShowToast] = React.useState(false);
      
      const [scannedData, setScannedData] = React.useState(null);

      // --- STATE UNTUK KAMERA ASLI ---
      const [isCameraActive, setIsCameraActive] = React.useState(false);
      const videoRef = React.useRef(null);
      const canvasRef = React.useRef(null);
      const isCameraActiveRef = React.useRef(false); // Untuk requestAnimationFrame

      // Logika Pergantian Otomatis Tepat 1 Juli
      const getTahunAjaran = () => {
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();
        if (currentMonth >= 6) {
          return `${currentYear}/${currentYear + 1}`;
        } else {
          return `${currentYear - 1}/${currentYear}`;
        }
      };
      const tahunAjaran = getTahunAjaran();

      const stats = {
        totalSiswa: students.length,
        hadirSiswa: students.filter(s => s.status === 'Hadir').length,
        totalGuru: teachers.length,
        hadirGuru: teachers.filter(t => t.status === 'Hadir').length,
      };

      const triggerSuccess = (msg) => {
        setToastMsg(msg);
        setShowToast(true);
        setTimeout(() => setShowToast(false), 3500);
      };

      // MATIKAN KAMERA JIKA PINDAH TAB
      React.useEffect(() => {
         if (activeTab !== 'scan') {
            stopCamera();
         }
      }, [activeTab]);

      const tarikDataServer = async (type) => {
        setIsFetching(true);
        try {
          const actionParam = type === 'siswa' ? 'get_all' : 'get_all_guru';
          const targetUrl = `${API_URL}?action=${actionParam}`;
          
          const response = await fetch(targetUrl, {
            method: "GET",
            redirect: "follow"
          });
          
          const textResponse = await response.text();
          
          try {
            const data = JSON.parse(textResponse);
            
            if (Array.isArray(data)) {
              if (type === 'siswa') {
                const serverStudents = data.map((s) => ({
                  id: s.nis || s.baris,
                  nik: s.nik,
                  name: s.nama || 'Tanpa Nama',
                  kelas: s.tahunAjaran || 'Siswa Aktif',
                  avatar: s.jk === 'Laki-laki' || s.jk === 'L' ? '👦' : '👧',
                  status: null,
                  time: null,
                  type: 'siswa'
                }));
                setStudents(serverStudents);
                triggerSuccess(`Berhasil menarik ${serverStudents.length} data Siswa!`);
              } else {
                const serverTeachers = data.map((t) => ({
                  id: t.nis || t.baris, 
                  nik: t.nik,
                  name: t.nama || 'Tanpa Nama',
                  jabatan: t.jabatan || 'Guru',
                  avatar: t.jk === 'Laki-laki' || s.jk === 'L' ? '👨‍🏫' : '👩‍🏫',
                  status: null,
                  time: null,
                  type: 'guru'
                }));
                setTeachers(serverTeachers);
                triggerSuccess(`Berhasil menarik ${serverTeachers.length} data Guru!`);
              }
            } else {
               alert("Data ditarik tapi struktur bukan array. Server merespon: " + textResponse.substring(0, 100));
            }
          } catch (parseError) {
             alert(`CRASH SERVER GOOGLE:\n\nSistem Google gagal memberikan data JSON dan membalas dengan Halaman HTML. Hal ini membuktikan nama Tab (Sheet) di Google Sheets Tuan belum bernama 'Master_Siswa' atau 'Master_Guru'.\n\nIsi Balasan Google:\n${textResponse.substring(0, 150)}...`);
          }
        } catch (error) {
          alert(`GAGAL TERHUBUNG KE INTERNET / CORS ERROR:\n\nPastikan Tuan telah men-deploy ulang script Google sebagai "New Version" dan disetel ke akses "Anyone" (Siapa Saja).\nPesan Error: ${error.message}`);
        } finally {
          setIsFetching(false);
        }
      };

      const markAttendance = (id, status, type) => {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        if (type === 'siswa') {
          setStudents(students.map(s => s.id === id ? { ...s, status, time: status === 'Hadir' ? timeStr : null } : s));
        } else {
          setTeachers(teachers.map(t => t.id === id ? { ...t, status, time: status === 'Hadir' ? timeStr : null } : t));
        }
      };

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.setAttribute("playsinline", true); // penting untuk iOS
            videoRef.current.play();
            isCameraActiveRef.current = true;
            setIsCameraActive(true);
            requestAnimationFrame(scanTick);
          }
        } catch (err) {
          alert("Gagal mengakses kamera! Pastikan izin kamera telah diberikan. Detail: " + err.message);
        }
      };

      const stopCamera = () => {
        isCameraActiveRef.current = false;
        setIsCameraActive(false);
        if (videoRef.current && videoRef.current.srcObject) {
          videoRef.current.srcObject.getTracks().forEach(track => track.stop());
          videoRef.current.srcObject = null;
        }
      };

      const scanTick = () => {
        if (!isCameraActiveRef.current) return;
        if (videoRef.current && videoRef.current.readyState === videoRef.current.HAVE_ENOUGH_DATA) {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          
          canvas.height = video.videoHeight;
          canvas.width = video.videoWidth;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          
          if (window.jsQR) {
             const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
             const code = window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
             
             if (code && code.data) {
                // Berhasil menemukan QR! Ambil jepretan foto (Selfie Base64) dari layar canvas
                const base64Image = canvas.toDataURL('image/jpeg', 0.7);
                handleQRDetected(code.data, base64Image);
                return; // Stop siklus agar tidak memindai berulang
             }
          }
        }
        requestAnimationFrame(scanTick);
      };

      const handleQRDetected = async (qrNik, fotoBase64) => {
         stopCamera(); // Matikan kamera sesaat setelah scan berhasil
         
         // 1. Cek apakah ini NIK/ID Guru
         const guru = teachers.find(t => t.nik === qrNik || t.id.toString() === qrNik.toString());
         if (guru) {
            markAttendance(guru.id, 'Hadir', 'guru');
            setScannedData({ ...guru, foto: fotoBase64 });
            triggerSuccess("ID Guru Dikenali! Mengirim foto ke server...");
            
            // JALUR KIRIM SELFIE KE GOOGLE SHEETS
            try {
                const payload = {
                    action: "absen_guru",
                    data: {
                        nik: guru.nik || guru.id,
                        fotoBase64: fotoBase64,
                        fotoMime: "image/jpeg",
                        jenis: "datang"
                    }
                };
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    body: JSON.stringify(payload)
                });
                const resData = await response.json();
                if(resData.status === "sukses") {
                    triggerSuccess("Terkirim! Foto & Absen Guru tersimpan di server Tuan.");
                } else {
                    alert("Gagal simpan di server: " + resData.pesan);
                }
            } catch (err) {
                alert("Gagal mengirim ke server (Kemungkinan salah URL/CORS): " + err.message);
            }
            return;
         }

         // 2. Cek apakah ini NIK/ID Siswa
         const siswa = students.find(s => s.nik === qrNik || s.id.toString() === qrNik.toString());
         if (siswa) {
            markAttendance(siswa.id, 'Hadir', 'siswa');
            setScannedData({ ...siswa, foto: fotoBase64 });
            triggerSuccess("ID Siswa Dikenali! (Disimpan Lokal, Fungsi Server Belum Tersedia)");
            return;
         }

         // 3. Tidak dikenali
         alert(`QR Code dengan isi [${qrNik}] tidak ditemukan di dalam data Guru maupun Siswa! Pastikan Anda telah menekan 'Tarik Server' terlebih dahulu.`);
      };

      return (
        <div className="min-h-screen relative flex justify-center pb-24 text-white">
          
          {/* Latar Belakang Screensaver dan Taburan Gelembung Mutlak */}
          <div className="bg-screensaver"></div>
          <Bubbles />

          {/* Notifikasi Toast */}
          <div className={`fixed top-6 right-4 glass-dark px-4 py-3 rounded-2xl border-l-4 border-green-500 flex items-center gap-3 z-[100] transition-all duration-500 ${showToast ? 'translate-x-0 opacity-100' : 'translate-x-full opacity-0'}`}>
             <div className="text-xl">✅</div>
             <div>
                <p className="font-bold text-sm">Informasi</p>
                <p className="text-xs text-gray-300 w-44">{toastMsg}</p>
             </div>
          </div>

          <div className="w-full max-w-md min-h-screen flex flex-col relative z-10 glass-dark border-x border-slate-700/50 shadow-2xl">
            
            <header className="p-4 pt-6 rounded-b-3xl glass-dark border-b border-slate-600 shadow-xl flex flex-col items-center relative z-40">
              <div className="text-center w-full px-2">
                <h1 className="text-lg md:text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 leading-tight">
                  TK PGRI PAKANDANGAN SANGRA
                </h1>
                <h2 className="text-[10px] md:text-xs font-bold mt-1 text-gray-400">
                  KEC. BLUTO KAB. SUMENEP
                </h2>
                <div className="inline-flex items-center gap-1 px-4 py-1.5 mt-3 rounded-full text-xs font-bold glass-card-dark text-cyan-300 border-cyan-800">
                  📅 TAHUN AJARAN : {tahunAjaran}
                </div>
              </div>
            </header>

            <main className="flex-1 w-full p-4 overflow-y-auto">
              
              {/* HALAMAN UTAMA */}
              {activeTab === 'dashboard' && (
                <div className="space-y-4">
                  <div className="glass-card-dark p-5 rounded-3xl flex flex-col items-center text-center gap-3 relative overflow-hidden shadow-lg border border-slate-600">
                    <div className="text-5xl drop-shadow-lg animate-pulse">🏫</div>
                    <div>
                      <h2 className="text-xl font-black">Sistem Terhubung! ✨</h2>
                      <p className="text-xs font-medium text-gray-400 mt-1">Sistem Absensi Pangkalan Data Terpusat</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    {[
                      { label: 'Total Siswa', val: stats.totalSiswa, color: 'bg-blue-900/50 text-blue-300 border-blue-700/50' },
                      { label: 'Siswa Hadir', val: stats.hadirSiswa, color: 'bg-green-900/50 text-green-300 border-green-700/50' },
                      { label: 'Total Guru', val: stats.totalGuru, color: 'bg-purple-900/50 text-purple-300 border-purple-700/50' },
                      { label: 'Guru Hadir', val: stats.hadirGuru, color: 'bg-emerald-900/50 text-emerald-300 border-emerald-700/50' }
                    ].map((s, idx) => (
                      <div key={idx} className={`glass-card-dark p-4 rounded-3xl text-center border shadow-md ${s.color}`}>
                        <h3 className="text-3xl font-black">{s.val}</h3>
                        <p className="font-bold text-[10px] mt-1">{s.label}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* HALAMAN DATA SISWA & GURU */}
              {(activeTab === 'siswa' || activeTab === 'guru') && (
                <div className="space-y-4">
                  <button 
                    onClick={() => tarikDataServer(activeTab)} 
                    disabled={isFetching}
                    className={`w-full py-3.5 rounded-2xl font-bold shadow-lg flex items-center justify-center gap-2 text-sm transition-all border border-blue-500/30 ${
                      isFetching ? 'bg-slate-700 text-gray-400' : 'bg-gradient-to-r from-blue-600 to-cyan-600 text-white hover:brightness-110 active:scale-95'
                    }`}
                  >
                    {isFetching ? '⏳ Mengambil Data Server...' : '📥 Tarik Data Server'}
                  </button>

                  <input
                    type="text"
                    placeholder={`🔍 Cari ${activeTab}...`}
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full px-4 py-3 rounded-2xl font-medium outline-none text-sm glass-card-dark text-white border-slate-600 focus:border-cyan-500 transition-colors"
                  />

                  <div className="space-y-3">
                    {(activeTab === 'siswa' ? students : teachers)
                      .filter(item => item.name.toLowerCase().includes(searchQuery.toLowerCase()))
                      .map((item) => (
                      <div key={item.id} className={`p-3 rounded-2xl border transition-all flex items-center justify-between ${
                        item.status === 'Hadir' ? 'bg-green-900/40 border-green-700' :
                        item.status === 'Absen' ? 'bg-red-900/40 border-red-700' :
                        'glass-card-dark border-slate-700'
                      }`}>
                        <div className="flex items-center gap-3">
                          <div className="text-3xl drop-shadow-md">{item.avatar}</div>
                          <div>
                            <h3 className="font-bold text-sm text-white">{item.name}</h3>
                            <p className="text-[10px] font-bold text-cyan-400 uppercase">ID: {item.id} • {item.kelas || item.jabatan}</p>
                          </div>
                        </div>

                        <div className="flex flex-col items-end gap-1">
                          {item.time && <span className="text-[10px] font-bold text-green-300 bg-green-900 px-2 py-0.5 rounded-full">{item.time} WIB</span>}
                          <div className="flex gap-1 mt-1">
                            <button onClick={() => markAttendance(item.id, 'Hadir', activeTab)} className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs transition-all active:scale-90 ${item.status === 'Hadir' ? 'bg-green-600 text-white' : 'bg-slate-700 text-gray-400 hover:bg-slate-600'}`}>✔️</button>
                            <button onClick={() => markAttendance(item.id, 'Absen', activeTab)} className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs transition-all active:scale-90 ${item.status === 'Absen' ? 'bg-red-600 text-white' : 'bg-slate-700 text-gray-400 hover:bg-slate-600'}`}>❌</button>
                          </div>
                        </div>
                      </div>
                    ))}
                    
                    {(activeTab === 'siswa' ? students : teachers).length === 0 && !isFetching && (
                      <div className="text-center py-10 text-gray-400 font-medium text-xs flex flex-col items-center gap-2">
                        <span className="text-4xl opacity-50">📂</span>
                        Data di aplikasi masih kosong.<br/>Tekan "Tarik Data Server".
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* HALAMAN SCANNER KAMERA NYATA */}
              {activeTab === 'scan' && (
                <div className="space-y-6 flex flex-col items-center">
                  <div className="text-center mt-2">
                    <h2 className="text-2xl font-black text-white">Kamera Scanner</h2>
                    <p className="text-xs text-gray-400">Arahkan QR Guru / Siswa. Aplikasi akan memotret otomatis.</p>
                  </div>

                  <div className="relative w-64 h-64 md:w-80 md:h-80 bg-black rounded-3xl overflow-hidden shadow-[0_0_30px_rgba(34,197,94,0.3)] border-4 border-slate-800 flex items-center justify-center">
                    
                    <video ref={videoRef} className="absolute inset-0 w-full h-full object-cover" playsInline muted></video>
                    <canvas ref={canvasRef} className="hidden"></canvas>

                    {/* Laser overlay saat menyala */}
                    {isCameraActive && <div className="laser-scanner"></div>}
                    
                    <div className="absolute top-4 left-4 w-8 h-8 border-t-4 border-l-4 border-green-500 rounded-tl-xl z-20"></div>
                    <div className="absolute top-4 right-4 w-8 h-8 border-t-4 border-r-4 border-green-500 rounded-tr-xl z-20"></div>
                    <div className="absolute bottom-4 left-4 w-8 h-8 border-b-4 border-l-4 border-green-500 rounded-bl-xl z-20"></div>
                    <div className="absolute bottom-4 right-4 w-8 h-8 border-b-4 border-r-4 border-green-500 rounded-br-xl z-20"></div>

                    {!isCameraActive && (
                       <div className="absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-10">
                          <span className="text-5xl mb-2 opacity-50">📷</span>
                          <span className="text-xs font-bold text-gray-400">Kamera Mati</span>
                       </div>
                    )}
                  </div>

                  <button onClick={isCameraActive ? stopCamera : startCamera} className={`w-64 py-4 rounded-2xl font-black text-white text-sm shadow-xl transition-all active:scale-95 border ${isCameraActive ? 'bg-red-600 border-red-400/50' : 'bg-gradient-to-r from-green-500 to-emerald-600 border-green-400/50'}`}>
                    {isCameraActive ? '❌ MATIKAN KAMERA' : '▶️ NYALAKAN KAMERA SCANNER'}
                  </button>

                  {/* MODAL HASIL SCAN (MENAMPILKAN FOTO SELFIE) */}
                  {scannedData && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
                      <div className="glass-card-dark p-8 rounded-3xl shadow-2xl flex flex-col items-center text-center w-full max-w-xs border-4 border-green-500 relative overflow-hidden">
                         <button onClick={() => setScannedData(null)} className="absolute top-4 right-4 text-gray-400 hover:text-white">❌</button>
                         
                         {scannedData.foto ? (
                             <img src={scannedData.foto} alt="Selfie" className="w-24 h-24 rounded-full border-4 border-white mb-2 object-cover shadow-lg z-10" />
                         ) : (
                             <div className="text-7xl mb-2 animate-bounce z-10">{scannedData.avatar}</div>
                         )}
                         
                         <h3 className="text-2xl font-black text-white z-10">{scannedData.name}</h3>
                         <p className="text-sm font-bold text-cyan-400 mt-1 uppercase z-10">{scannedData.type} • {scannedData.kelas || scannedData.jabatan}</p>
                         <div className="mt-4 bg-green-900 border border-green-500 text-green-300 px-5 py-2 rounded-full font-black z-10">
                           Hadir Pukul: {scannedData.time}
                         </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

            </main>

            {/* NAVIGASI BAWAH */}
            <nav className="fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-sm rounded-3xl z-50 glass-dark border border-slate-600 shadow-[0_10px_40px_rgba(0,0,0,0.8)] p-2">
              <ul className="flex flex-row justify-between items-center relative px-2">
                {[
                  { id: 'dashboard', icon: '🏠', label: 'Beranda' },
                  { id: 'siswa', icon: '👨‍🎓', label: 'Siswa' },
                  { id: 'scan', isFab: true },
                  { id: 'guru', icon: '👨‍🏫', label: 'Guru' },
                ].map((item, idx) => (
                  item.isFab ? (
                    <li key={idx} className="flex-1 flex justify-center relative -top-8">
                      <button 
                        onClick={() => setActiveTab('scan')} 
                        className={`w-16 h-16 rounded-full flex items-center justify-center text-3xl transition-all shadow-[0_10px_25px_rgba(34,197,94,0.5)] transform hover:scale-110 active:scale-95 border-2 border-white/20 ${
                          activeTab === 'scan' ? 'bg-gradient-to-r from-green-500 to-emerald-600' : 'bg-slate-700'
                        }`}
                      >
                        📷
                      </button>
                    </li>
                  ) : (
                    <li key={idx} className="flex-1 flex justify-center">
                      <button onClick={() => setActiveTab(item.id)} className={`p-2 rounded-2xl flex flex-col items-center gap-1 transition-all w-full ${
                        activeTab === item.id ? 'bg-slate-700/80 scale-110' : 'opacity-60 hover:opacity-100'
                      }`}>
                        <span className="text-xl drop-shadow-md">{item.icon}</span>
                        <span className={`text-[9px] font-bold ${activeTab === item.id ? 'text-cyan-400' : 'text-gray-300'}`}>{item.label}</span>
                      </button>
                    </li>
                  )
                ))}
              </ul>
            </nav>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
