<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Absensi Smart School TK PGRI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes floatBubble {
      0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
    }
    @keyframes scanLaser {
      0% { top: 0%; box-shadow: 0 0 10px 2px rgba(34, 197, 94, 0.5); }
      50% { top: 100%; box-shadow: 0 0 10px 2px rgba(34, 197, 94, 1); }
      100% { top: 0%; box-shadow: 0 0 10px 2px rgba(34, 197, 94, 0.5); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    
    /* Latar Screensaver Cerah Kaca */
    .bg-screensaver {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      z-index: -10;
    }

    /* Efek Gelembung */
    .bubble {
      position: absolute;
      bottom: -50px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.8);
      animation: floatBubble infinite linear;
      z-index: -5;
    }

    /* Glassmorphism Dark Mode Terkunci */
    .glass-dark {
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .glass-card-dark {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .laser-scanner {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: #22c55e;
      animation: scanLaser 2s linear infinite;
      z-index: 20;
    }

    .animate-pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="text-white antialiased overflow-x-hidden selection:bg-indigo-500 selection:text-white">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // GANTI DENGAN URL DEPLOY TERBARU TUAN!
    const API_URL = "https://script.google.com/macros/s/AKfycbyN5J-6IB-98EV2SAuLa3ysvt13Jmt8IWmxVLkK9YWH8Exd-7MNJS6xglDw5qy7YKYY/exec";

    // Komponen Gelembung Air Mutlak (50 Gelembung)
    const Bubbles = () => {
      const bubbles = Array.from({ length: 50 });
      return (
        <div className="fixed inset-0 overflow-hidden pointer-events-none z-[-5]">
          {bubbles.map((_, i) => (
            <div key={i} className="bubble" style={{
                left: `${Math.random() * 100}%`,
                width: `${Math.random() * 40 + 10}px`,
                height: `${Math.random() * 40 + 10}px`,
                animationDuration: `${Math.random() * 8 + 4}s`,
                animationDelay: `${Math.random() * 5}s`
              }} />
          ))}
        </div>
      );
    };

    const App = () => {
      // State Navigasi & Data
      const [activeTab, setActiveTab] = useState('dashboard');
      const [students, setStudents] = useState([]);
      const [teachers, setTeachers] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      
      // State UI Interaksi
      const [isFetching, setIsFetching] = useState(false);
      const [showToast, setShowToast] = useState(false);
      const [toastMsg, setToastMsg] = useState("");
      const [messageBox, setMessageBox] = useState({ show: false, title: '', message: '', type: 'info' });
      const [scannedData, setScannedData] = useState(null);

      // State Kamera Asli Perangkat Keras
      const [isCameraActive, setIsCameraActive] = useState(false);
      const [facingMode, setFacingMode] = useState("environment"); // "environment" = belakang, "user" = depan
      const [isProcessingQR, setIsProcessingQR] = useState(false);
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const isCameraActiveRef = useRef(false);

      const getTahunAjaran = () => {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth(); 
        return month >= 6 ? `${year}/${year + 1}` : `${year - 1}/${year}`;
      };
      const tahunAjaran = getTahunAjaran();

      // Matikan kamera jika pindah menu
      useEffect(() => {
         if (activeTab !== 'scan') stopCamera();
      }, [activeTab]);

      const showMessage = (title, message, type = 'info') => {
        setMessageBox({ show: true, title, message, type });
      };

      const triggerSuccess = (msg) => {
        setToastMsg(msg);
        setShowToast(true);
        setTimeout(() => setShowToast(false), 3500);
      };

      const stats = {
        totalSiswa: students.length,
        hadirSiswa: students.filter(s => s.status === 'Hadir').length,
        totalGuru: teachers.length,
        hadirGuru: teachers.filter(t => t.status === 'Hadir').length,
      };

      const tarikDataServer = async (type) => {
        setIsFetching(true);
        try {
          const actionParam = type === 'siswa' ? 'get_all' : 'get_all_guru';
          const targetUrl = `${API_URL}?action=${actionParam}`;
          
          const response = await fetch(targetUrl, { method: "GET", redirect: "follow" });
          const textResponse = await response.text();
          
          try {
            const data = JSON.parse(textResponse);
            if (Array.isArray(data)) {
              if (type === 'siswa') {
                const serverStudents = data.map((s) => ({
                  id: s.nis || s.baris, nik: s.nik, name: s.nama || 'Tanpa Nama',
                  kelas: s.status || 'Siswa Aktif', avatar: s.jk === 'Laki-laki' || s.jk === 'L' ? '👦' : '👧',
                  status: null, time: null, type: 'siswa'
                }));
                setStudents(serverStudents);
                triggerSuccess(`Berhasil menarik ${serverStudents.length} data Siswa!`);
              } else {
                const serverTeachers = data.map((t) => ({
                  id: t.nis || t.baris, nik: t.nik, name: t.nama || 'Tanpa Nama',
                  jabatan: t.jabatan || 'Guru', avatar: t.jk === 'Laki-laki' || t.jk === 'L' ? '👨‍🏫' : '👩‍🏫',
                  status: null, time: null, type: 'guru'
                }));
                setTeachers(serverTeachers);
                triggerSuccess(`Berhasil menarik ${serverTeachers.length} data Guru!`);
              }
            } else {
               showMessage("Format Gagal", "Sistem Google membalas dengan HTML. Pastikan tab Master_Siswa & Master_Guru bernama tepat.", "error");
            }
          } catch (parseError) {
             showMessage("Error Server (Crash)", "Data gagal diproses (Bukan JSON). Google Apps Script mengalami crash.", "error");
          }
        } catch (error) {
          showMessage("Gagal Terhubung (CORS)", "Pastikan API_URL di-deploy 'New Version' dengan akses 'Anyone'.", "error");
        } finally {
          setIsFetching(false);
        }
      };

      const startCamera = async (mode = facingMode) => {
        try {
          if (videoRef.current && videoRef.current.srcObject) stopCamera();
          let stream;
          try {
             // Upayakan kamera spesifik (depan/belakang)
             stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode } });
          } catch (e) {
             // Fallback jika tidak mendukung mode
             stream = await navigator.mediaDevices.getUserMedia({ video: true });
          }
          
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.setAttribute("playsinline", true); // Wajib untuk iOS/Safari
            videoRef.current.play();
            isCameraActiveRef.current = true;
            setIsCameraActive(true);
            setFacingMode(mode);
            requestAnimationFrame(scanTick);
          }
        } catch (err) {
          showMessage("Kamera Terblokir", "Browser / Perangkat menolak akses kamera fisik. Pastikan Anda mengizinkan akses.", "error");
        }
      };

      const stopCamera = () => {
        isCameraActiveRef.current = false;
        setIsCameraActive(false);
        if (videoRef.current && videoRef.current.srcObject) {
          videoRef.current.srcObject.getTracks().forEach(track => track.stop());
          videoRef.current.srcObject = null;
        }
      };

      const toggleCamera = () => {
         const newMode = facingMode === "environment" ? "user" : "environment";
         if (isCameraActive) startCamera(newMode); else setFacingMode(newMode);
      };

      const scanTick = () => {
        if (!isCameraActiveRef.current || isProcessingQR) return;
        if (videoRef.current && videoRef.current.readyState === videoRef.current.HAVE_ENOUGH_DATA) {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          canvas.height = video.videoHeight; canvas.width = video.videoWidth;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          
          if (window.jsQR) {
             const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
             const code = window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
             if (code && code.data) {
                // Konversi gambar ke base64 (akan dikirim hanya untuk GURU)
                const base64Image = canvas.toDataURL('image/jpeg', 0.8);
                handleQRDetected(code.data, base64Image);
                return; 
             }
          }
        }
        requestAnimationFrame(scanTick);
      };

      const handleQRDetected = async (qrNik, fotoBase64) => {
         setIsProcessingQR(true); 
         stopCamera();
         
         /* ---------------------------------------------------------
          * LOGIKA UNTUK GURU (MENGIRIM FOTO - MEMBUTUHKAN BUKTI FISIK)
          * ---------------------------------------------------------*/
         const guru = teachers.find(t => t.nik === qrNik || t.id.toString() === qrNik.toString());
         if (guru) {
            triggerSuccess("⏳ Wajah tertangkap! Mengunggah bukti kehadiran Guru...");
            try {
                // Payload LENGKAP dengan fotoBase64
                const payload = { action: "absen_guru", data: { nik: guru.nik || guru.id, fotoBase64: fotoBase64, fotoMime: "image/jpeg", jenis: "datang" } };
                const response = await fetch(API_URL, { 
                    method: 'POST', redirect: 'follow', headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) 
                });
                const resData = await response.json();
                
                if(resData.status === "sukses") {
                    const timeStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                    setTeachers(teachers.map(t => t.id === guru.id ? { ...t, status: 'Hadir', time: timeStr } : t));
                    setScannedData({ ...guru, foto: fotoBase64, time: timeStr });
                    triggerSuccess("✅ Mutlak! Absen Guru masuk ke Tab Absensi_Guru.");
                } else {
                    showMessage("Ditolak Server", resData.pesan, "error");
                }
            } catch (err) {
                showMessage("Gagal Mengunggah", "Koneksi terputus saat menyimpan foto ke Google Drive/Sheets.", "error");
            }
            setIsProcessingQR(false);
            return;
         }

         /* ---------------------------------------------------------
          * LOGIKA UNTUK SISWA (TIDAK MENGIRIM FOTO - HEMAT MEMORI)
          * ---------------------------------------------------------*/
         const siswa = students.find(s => s.nik === qrNik || s.id.toString() === qrNik.toString());
         if (siswa) {
            triggerSuccess("⏳ ID terdeteksi! Mencatat kehadiran Siswa di Server...");
            try {
                // Payload HEMAT MEMORI (Tanpa fotoBase64 dan fotoMime)
                const payload = { action: "absen_siswa", data: { nik: siswa.nik || siswa.id, jenis: "datang" } };
                const response = await fetch(API_URL, { 
                    method: 'POST', redirect: 'follow', headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) 
                });
                const resData = await response.json();
                
                if(resData.status === "sukses") {
                    const timeStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                    setStudents(students.map(s => s.id === siswa.id ? { ...s, status: 'Hadir', time: timeStr } : s));
                    // Tidak menampilkan foto selfie untuk siswa di pop-up
                    setScannedData({ ...siswa, time: timeStr });
                    triggerSuccess("✅ Mutlak! Absen Siswa masuk ke Tab Absensi_Siswa.");
                } else {
                    showMessage("Ditolak Server", resData.pesan, "error");
                }
            } catch (err) {
                showMessage("Gagal Menyimpan", "Koneksi terputus ke Google Sheets.", "error");
            }
            setIsProcessingQR(false);
            return;
         }

         showMessage("Data Tak Dikenali", `QR Code [${qrNik}] tidak ada dalam memori aplikasi. Pastikan Anda sudah Tarik Data Server!`, "error");
         setIsProcessingQR(false);
      };

      return (
        <div className="min-h-screen relative flex justify-center pb-24 text-white font-sans">
          
          {/* Latar Belakang Screensaver Terang + Efek Gelembung Mutlak */}
          <div className="bg-screensaver"></div>
          <Bubbles />

          {/* Toast Notification */}
          <div className={`fixed top-6 right-4 glass-dark px-4 py-3 rounded-2xl border-l-4 border-green-500 flex items-center gap-3 z-[100] transition-all duration-500 ${showToast ? 'translate-x-0 opacity-100' : 'translate-x-[150%] opacity-0'}`}>
             <div className="text-xl">✅</div>
             <div><p className="font-bold text-sm">Sistem</p><p className="text-xs text-gray-300 w-44">{toastMsg}</p></div>
          </div>

          {/* Message Box Cerdas */}
          {messageBox.show && (
              <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-pop-in">
                  <div className="bg-slate-800 p-6 rounded-3xl border border-slate-600 shadow-2xl max-w-sm w-full text-center">
                      <div className="text-5xl mb-4">{messageBox.type === 'error' ? '❌' : 'ℹ️'}</div>
                      <h3 className={`text-xl font-black mb-2 ${messageBox.type === 'error' ? 'text-red-400' : 'text-blue-400'}`}>{messageBox.title}</h3>
                      <p className="text-gray-300 text-sm mb-6">{messageBox.message}</p>
                      <button onClick={() => setMessageBox({show: false, title: '', message: '', type: 'info'})} className="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-xl transition-all">Mengerti</button>
                  </div>
              </div>
          )}

          {/* Pembungkus UI Dark Mode (Terkunci Mutlak) */}
          <div className="w-full max-w-md min-h-screen flex flex-col relative z-10 glass-dark border-x border-slate-700/50 shadow-2xl">
            <header className="p-4 pt-6 rounded-b-3xl glass-dark border-b border-slate-600 shadow-xl flex flex-col items-center relative z-40">
              <div className="text-center w-full px-2">
                <h1 className="text-lg md:text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 leading-tight">TK PGRI PAKANDANGAN SANGRA</h1>
                <h2 className="text-[10px] md:text-xs font-bold mt-1 text-gray-400">KEC. BLUTO KAB. SUMENEP</h2>
                <div className="inline-flex items-center gap-1 px-4 py-1.5 mt-3 rounded-full text-xs font-bold glass-card-dark text-cyan-300 border-cyan-800">
                  🎓 TAHUN AJARAN : {tahunAjaran}
                </div>
              </div>
            </header>

            <main className="flex-1 w-full p-4 overflow-y-auto">
              
              {/* Beranda Dashboard */}
              {activeTab === 'dashboard' && (
                <div className="space-y-4 animate-pop-in">
                  <div className="glass-card-dark p-5 rounded-3xl flex flex-col items-center text-center gap-3 relative overflow-hidden shadow-lg border border-slate-600">
                    <div className="text-5xl drop-shadow-md animate-pulse">🏫</div>
                    <div><h2 className="text-xl font-black">Sistem Terhubung! ✨</h2><p className="text-xs font-medium text-gray-400 mt-1">Sistem Absensi Pangkalan Data Terpusat</p></div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    {[
                      { label: 'Total Siswa', val: stats.totalSiswa, color: 'bg-blue-900/50 text-blue-300 border-blue-700/50' },
                      { label: 'Siswa Hadir', val: stats.hadirSiswa, color: 'bg-green-900/50 text-green-300 border-green-700/50' },
                      { label: 'Total Guru', val: stats.totalGuru, color: 'bg-purple-900/50 text-purple-300 border-purple-700/50' },
                      { label: 'Guru Hadir', val: stats.hadirGuru, color: 'bg-emerald-900/50 text-emerald-300 border-emerald-700/50' }
                    ].map((s, idx) => (
                      <div key={idx} className={`glass-card-dark p-4 rounded-3xl text-center border shadow-md ${s.color}`}>
                        <h3 className="text-3xl font-black">{s.val}</h3><p className="font-bold text-[10px] mt-1">{s.label}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Menu Data (Siswa & Guru) - Tanpa Input Manual */}
              {(activeTab === 'siswa' || activeTab === 'guru') && (
                <div className="space-y-4 animate-pop-in">
                  <button onClick={() => tarikDataServer(activeTab)} disabled={isFetching} className={`w-full py-3.5 rounded-2xl font-bold shadow-lg flex items-center justify-center gap-2 text-sm transition-all border border-blue-500/30 ${isFetching ? 'bg-slate-700 text-gray-400 cursor-not-allowed' : 'bg-gradient-to-r from-blue-600 to-cyan-600 text-white hover:brightness-110 active:scale-95'}`}>
                    {isFetching ? '🔄 Mengambil Data...' : '📥 Tarik Data Server'}
                  </button>
                  
                  <div className="relative">
                    <span className="absolute left-4 top-3 text-gray-400">🔍</span>
                    <input type="text" placeholder={`Cari ${activeTab}...`} value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-10 pr-4 py-3 rounded-2xl font-medium outline-none text-sm glass-card-dark text-white border-slate-600 focus:border-cyan-500 transition-colors" />
                  </div>

                  <div className="space-y-3">
                    {(activeTab === 'siswa' ? students : teachers).filter(item => item.name.toLowerCase().includes(searchQuery.toLowerCase())).map((item) => (
                      <div key={item.id} className={`p-3 rounded-2xl border transition-all flex items-center justify-between ${item.status === 'Hadir' ? 'bg-green-900/40 border-green-700' : 'glass-card-dark border-slate-700'}`}>
                        <div className="flex items-center gap-3">
                          <div className="text-3xl drop-shadow-md">{item.avatar}</div>
                          <div>
                            <h3 className="font-bold text-sm text-white">{item.name}</h3>
                            <p className="text-[10px] font-bold text-cyan-400 uppercase">ID: {item.id} • {item.kelas || item.jabatan}</p>
                          </div>
                        </div>
                        <div className="flex flex-col items-end gap-1">
                          {item.time && <span className="text-[10px] font-bold text-green-300 bg-green-900 px-2 py-0.5 rounded-full border border-green-500/50">{item.time} WIB</span>}
                        </div>
                      </div>
                    ))}
                    {(activeTab === 'siswa' ? students : teachers).length === 0 && !isFetching && (
                      <div className="text-center py-10 text-gray-400 font-medium text-xs flex flex-col items-center gap-2"><span className="text-4xl opacity-30">📁</span>Data kosong. Silakan Tarik Data Server!</div>
                    )}
                  </div>
                </div>
              )}

              {/* Menu Pemindai Kamera Fisik & UI Balik Lensa */}
              {activeTab === 'scan' && (
                <div className="space-y-6 flex flex-col items-center animate-pop-in">
                  <div className="text-center mt-2">
                    <h2 className="text-2xl font-black text-white">Scanner Universal</h2>
                    <p className="text-xs text-gray-400">Arahkan QR Guru atau Siswa. Mesin akan mendeteksi otomatis.</p>
                  </div>
                  
                  <div className="relative w-64 h-64 md:w-80 md:h-80 bg-black rounded-3xl overflow-hidden shadow-[0_0_30px_rgba(34,197,94,0.3)] border-4 border-slate-800 flex items-center justify-center">
                    <video ref={videoRef} className="absolute inset-0 w-full h-full object-cover" playsInline muted></video>
                    <canvas ref={canvasRef} className="hidden"></canvas>
                    
                    {isCameraActive && <div className="laser-scanner"></div>}
                    
                    <div className="absolute top-4 left-4 w-8 h-8 border-t-4 border-l-4 border-green-500 rounded-tl-xl z-20"></div>
                    <div className="absolute top-4 right-4 w-8 h-8 border-t-4 border-r-4 border-green-500 rounded-tr-xl z-20"></div>
                    <div className="absolute bottom-4 left-4 w-8 h-8 border-b-4 border-l-4 border-green-500 rounded-bl-xl z-20"></div>
                    <div className="absolute bottom-4 right-4 w-8 h-8 border-b-4 border-r-4 border-green-500 rounded-br-xl z-20"></div>
                    
                    {!isCameraActive && <div className="absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-10"><span className="text-5xl opacity-50 mb-2">📷</span><span className="text-xs font-bold text-gray-400">Kamera Mati</span></div>}
                    {isProcessingQR && <div className="absolute inset-0 bg-black/60 flex flex-col items-center justify-center z-30"><span className="text-4xl animate-spin mb-2">⏳</span><span className="text-xs font-bold text-white bg-green-700 px-3 py-1 rounded-full">Menulis ke Server...</span></div>}
                  </div>

                  <div className="flex flex-col gap-3 w-64 md:w-80 relative z-20">
                    <button onClick={() => isCameraActive ? stopCamera() : startCamera(facingMode)} disabled={isProcessingQR} className={`w-full py-4 rounded-2xl font-black text-white text-sm shadow-xl transition-all active:scale-95 border ${isCameraActive ? 'bg-red-600 border-red-400/50' : 'bg-gradient-to-r from-green-500 to-emerald-600 border-green-400/50'} ${isProcessingQR ? 'opacity-50 cursor-not-allowed' : ''}`}>
                      {isCameraActive ? '❌ MATIKAN KAMERA' : '▶️ NYALAKAN KAMERA (ASLI)'}
                    </button>
                    {isCameraActive && (
                       <button onClick={toggleCamera} disabled={isProcessingQR} className="w-full py-3 rounded-2xl font-bold text-gray-200 text-xs shadow-md transition-all active:scale-95 border bg-slate-800/80 hover:bg-slate-700 backdrop-blur-md border-slate-600 flex items-center justify-center gap-2">
                          🔄 PUTAR KAMERA (DEPAN/BELAKANG)
                       </button>
                    )}
                  </div>

                  {/* Modal Validasi - Tampil JIKA Sukses Validasi Server */}
                  {scannedData && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4 animate-pop-in">
                      <div className="glass-card-dark p-8 rounded-3xl shadow-2xl flex flex-col items-center text-center w-full max-w-xs border-4 border-green-500 relative overflow-hidden">
                         <button onClick={() => setScannedData(null)} className="absolute top-4 right-4 text-gray-400 hover:text-white text-xl">❌</button>
                         {/* Avatar untuk siswa, Selfie Asli hanya untuk Guru */}
                         {scannedData.foto ? <img src={scannedData.foto} alt="Selfie" className="w-24 h-24 rounded-full border-4 border-white mb-2 object-cover shadow-lg z-10" /> : <div className="text-7xl mb-2 animate-bounce z-10">{scannedData.avatar}</div>}
                         <h3 className="text-2xl font-black text-white z-10 mt-2">{scannedData.name}</h3>
                         <p className="text-sm font-bold text-cyan-400 mt-1 uppercase z-10">{scannedData.type} • {scannedData.kelas || scannedData.jabatan}</p>
                         <div className="mt-4 bg-green-900 border border-green-500 text-green-300 px-5 py-2 rounded-full font-black z-10 shadow-lg">HADIR PUKUL: {scannedData.time} WIB</div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </main>

            {/* Navigasi Bawah */}
            <nav className="fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-sm rounded-3xl z-50 glass-dark border border-slate-600 shadow-[0_10px_40px_rgba(0,0,0,0.8)] p-2">
              <ul className="flex flex-row justify-between items-center relative px-2">
                {[
                  { id: 'dashboard', icon: '🏠', label: 'Beranda' },
                  { id: 'siswa', icon: '👦', label: 'Siswa' },
                  { id: 'scan', isFab: true },
                  { id: 'guru', icon: '👨‍🏫', label: 'Guru' },
                ].map((item, idx) => (
                  item.isFab ? (
                    <li key={idx} className="flex-1 flex justify-center relative -top-8">
                      <button onClick={() => setActiveTab('scan')} className={`w-16 h-16 rounded-full flex items-center justify-center text-3xl transition-all shadow-[0_10px_25px_rgba(34,197,94,0.5)] transform hover:scale-110 active:scale-95 border-2 border-white/20 ${activeTab === 'scan' ? 'bg-gradient-to-r from-green-500 to-emerald-600' : 'bg-slate-700'}`}>📷</button>
                    </li>
                  ) : (
                    <li key={idx} className="flex-1 flex justify-center">
                      <button onClick={() => setActiveTab(item.id)} className={`p-2 rounded-2xl flex flex-col items-center gap-1 transition-all w-full ${activeTab === item.id ? 'bg-slate-700/80 scale-110' : 'opacity-60 hover:opacity-100'}`}>
                        <span className="text-xl drop-shadow-md">{item.icon}</span>
                        <span className={`text-[9px] font-bold ${activeTab === item.id ? 'text-cyan-400' : 'text-gray-300'}`}>{item.label}</span>
                      </button>
                    </li>
                  )
                ))}
              </ul>
            </nav>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
